version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vod-backend
    ports:
      - "8080:3000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./yugen
      dockerfile: Dockerfile
    container_name: vod-frontend
    ports:
      - "80:80"
    env_file:
      - ./yugen/.env
    depends_on:
      - backend
    restart: unless-stopped

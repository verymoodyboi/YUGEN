version: "3.9"

services:
  backend:
    build: ./server
    container_name: vod-backend-dev
    working_dir: /usr/src/app
    volumes:
      - ./server:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    ports:
      - "8080:3000"
    env_file:
      - ./server/.env
    command: npm run dev

  frontend:
    image: node:20-alpine
    container_name: vod-frontend-dev
    working_dir: /app
    volumes:
      - ./yugen:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    env_file:
      - ./.env

volumes:
  backend_node_modules:
  frontend_node_modules:

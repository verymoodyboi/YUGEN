version: "3.9"

services:
  frontend:
    build:
      context: ./yugen
      dockerfile: Dockerfile
    container_name: vod-frontend
    ports:
      - "5173:80"
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vod-backend
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
    restart: unless-stopped
